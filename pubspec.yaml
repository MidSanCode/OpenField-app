name: openfield
description: "OpenField - An open social media platform."
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.2
  go_router: ^14.2.7
  http: ^1.2.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.0
  app_links: ^6.3.2
  image_picker: ^1.1.2
  logging: ^1.3.0
  path_provider: ^2.1.4
  flutter_markdown: ^0.7.4+2
  file_picker: ^8.1.2
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
