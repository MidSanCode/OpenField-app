name: openfield
description: "OpenField - An open social media platform."
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.7
  provider: ^6.1.2
  go_router: ^14.2.7
  http: ^1.2.2
  http_parser: ^4.0.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.0
  app_links: ^6.3.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  logging: ^1.3.0
  path_provider: ^2.1.4
  flutter_markdown: ^0.7.4+2
  file_picker: ^8.1.2
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2
  path: ^1.9.1
  record: ^5.1.2
  web_socket_channel: ^3.0.3
  pointycastle: ^4.0.0
  crypto: ^3.0.3
  package_info_plus: ^9.0.1
  flutter_js: ^0.8.3
  archive: ^3.6.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  image: ^4.3.0

# Force the federated record_* packages to a version that matches
# record_platform_interface 1.6.x shipped by record 5.2.x. The pub cache may
# contain a stale record_linux 0.7.2 that targets the old platform interface
# and breaks the Windows build with G76B49859/GE5CFE876 "missing
# implementations / fewer named arguments" errors.
dependency_overrides:
  record_linux: ^1.0.0
  record_platform_interface: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/

  fonts:
    - family: Chiron GoRound TC
      fonts:
        - asset: assets/fonts/ChironGoRoundTC-400R.otf
          weight: 400
        - asset: assets/fonts/ChironGoRoundTC-700B.otf
          weight: 700
