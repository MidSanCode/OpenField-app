name: Build OpenField

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Windows (x64)'
        type: boolean
        default: true
      build_linux:
        description: 'Linux (x64)'
        type: boolean
        default: false
      build_macos:
        description: 'macOS (x64/ARM)'
        type: boolean
        default: false
      build_android:
        description: 'Android (APK)'
        type: boolean
        default: false
      build_ios:
        description: 'iOS (IPA)'
        type: boolean
        default: false
      build_web:
        description: 'Web'
        type: boolean
        default: false
      publish_release:
        description: 'Publish a Release with the built archives'
        type: boolean
        default: false

# Build jobs only check out and upload artifacts, so read is enough; the
# release job widens to contents:write itself.
permissions:
  contents: read

jobs:
  windows:
    if: inputs.build_windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version: ').Line.Split(': ')[-1]
          $parts = $ver.Split('+')
          echo "BUILD_NAME=$($parts[0])" >> $env:GITHUB_ENV
          echo "BUILD_NUMBER=$($parts[1])" >> $env:GITHUB_ENV
      - name: Write config
        shell: pwsh
        run: |
          $json = @{
            BUILD_VERSION = "$env:BUILD_NAME"
            BUILD_NUMBER  = "$env:BUILD_NUMBER"
          } | ConvertTo-Json -Compress
          Set-Content config.json -Value $json -Encoding utf8
      - name: Get dependencies
        run: flutter pub get
      - name: Build portable (zip)
        run: |
          flutter build windows --release --build-name=$env:BUILD_NAME --build-number=$env:BUILD_NUMBER --dart-define-from-file=config.json
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath openfield-windows-$env:BUILD_NAME-portable.zip
      - name: Build installer (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $name = "旷野 OpenField"
          $exe = "build\windows\x64\runner\Release\openfield.exe"
          $iss = @"
          [Setup]
          AppName=$name
          AppVersion=$env:BUILD_NAME
          DefaultDirName={autopf}\OpenField
          DefaultGroupName=$name
          OutputDir=installer_output
          OutputBaseFilename=openfield-setup-$env:BUILD_NAME
          UninstallDisplayIcon={app}\openfield.exe
          [Files]
          Source: "$exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          "@
          $iss | Out-File setup.iss -Encoding utf8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: openfield-Windows-portable
          path: openfield-windows-${{ env.BUILD_NAME }}-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: openfield-Windows-installer
          path: installer_output/*.exe

  linux:
    if: inputs.build_linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BUILD_NAME=$(echo "$VER" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VER" | cut -d'+' -f2)
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
      - name: Write config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": "$BUILD_NUMBER"
          }
          EOF
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libasound2-dev libmpv-dev mpv
      - name: Get dependencies
        run: flutter pub get
      - name: Build
        run: flutter build linux --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
      - run: tar -czf openfield-linux-${{ env.BUILD_NAME }}.tar.gz -C build/linux/x64/release/bundle .

      # ---- AppImage -------------------------------------------------------
      - name: Build AppDir
        run: |
          set -euo pipefail
          BUNDLE=build/linux/x64/release/bundle
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/bin"

          # appimagetool requires exactly one desktop file at the AppDir root
          # and an icon whose name matches the desktop file's Icon= key.
          mkdir -p packaging
          cat > packaging/openfield.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=旷野 OpenField
          Comment=OpenField 社区客户端
          Exec=openfield
          Icon=openfield
          Terminal=false
          Categories=Network;Chat;InstantMessaging;
          StartupWMClass=com.midsancode.openfield
          EOF

          # The 1024x1024 store icon is the only square asset big enough for
          # the AppImage icon slot.
          cp ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png \
             packaging/openfield.png

          # linuxdeploy resolves the executable's dependencies with ldd, and
          # the Flutter engine library lives in the bundle rather than on the
          # system linker path, so expose it for that lookup.
          export LD_LIBRARY_PATH="$PWD/$BUNDLE/lib:${LD_LIBRARY_PATH:-}"

          # linuxdeploy and appimagetool both ship as AppImages, and running
          # one needs FUSE - which on ubuntu-24.04 means libfuse2t64, a package
          # the runner does not ship. The documented FUSE-less fallback is to
          # extract and run them, so the build never depends on FUSE state.
          export APPIMAGE_EXTRACT_AND_RUN=1

          # linuxdeploy walks ldd recursively, so --library pulls in libmpv
          # *and* its whole closure (ffmpeg, libass, ...). media_kit leaves
          # media_kit_libs_linux_bundled_libraries empty on Linux, i.e. it
          # expects mpv from the host, which is why the build installs it and
          # why the AppImage has to carry a copy.
          curl -fsSL -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage

          # Versioned tag, not a rolling one, so this can be a hard check.
          ACTUAL=$(sha256sum linuxdeploy.AppImage | cut -d' ' -f1)
          EXPECTED=620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::linuxdeploy digest mismatch: got $ACTUAL, expected $EXPECTED"
            exit 1
          fi

          MPV=$(ls /usr/lib/x86_64-linux-gnu/libmpv.so.* 2>/dev/null | head -1 || true)
          LIBS=()
          if [ -n "$MPV" ]; then
            echo "bundling $MPV and its dependencies"
            LIBS=(--library "$MPV")
          else
            echo "::warning::libmpv not found on the runner; the AppImage will need mpv installed on the host"
          fi

          ./linuxdeploy.AppImage \
            --appdir "$APPDIR" \
            --executable "$BUNDLE/openfield" \
            "${LIBS[@]}" \
            --desktop-file packaging/openfield.desktop \
            --icon-file packaging/openfield.png

          # A Flutter Linux bundle is not self-contained: the engine resolves
          # `lib/` and `data/` relative to the executable, so they are carried
          # over as one intact tree. This runs after linuxdeploy so its
          # dependency handling cannot disturb the layout.
          mkdir -p "$APPDIR/usr/bin/lib" "$APPDIR/usr/bin/data"
          cp -r "$BUNDLE/lib/." "$APPDIR/usr/bin/lib/"
          cp -r "$BUNDLE/data/." "$APPDIR/usr/bin/data/"

          # linuxdeploy writes an AppRun, but it does not know about the
          # bundle's private libraries, so extend rather than replace it.
          if [ -f "$APPDIR/AppRun" ]; then
            mv "$APPDIR/AppRun" "$APPDIR/AppRun.linuxdeploy"
          fi
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          # The bundle's own lib/ must win over host copies: it carries
          # libflutter_linux_gtk.so and the plugin libraries.
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$HERE/usr/lib:${LD_LIBRARY_PATH:-}"
          exec "$HERE/usr/bin/openfield" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          # Guard against SIGPIPE: `find | head` would otherwise fail the step
          # under `set -o pipefail` once head closes the pipe. The listing is
          # purely diagnostic.
          find "$APPDIR" -maxdepth 2 | head -40 || true

      - name: Build AppImage
        run: |
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1
          export ARCH=x86_64
          # VERSION is written into the desktop entry and, with no explicit
          # destination, into the output filename.
          export VERSION="$BUILD_NAME"

          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

          # The 'continuous' tag is a rolling release, so the digest changes
          # whenever upstream rebuilds. Verify it to catch a mangled or
          # substituted download, but warn rather than fail on drift: a hard
          # pin would rot into a permanently red build.
          EXPECTED=a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0
          ACTUAL=$(sha256sum appimagetool.AppImage | cut -d' ' -f1)
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "appimagetool digest verified"
          else
            echo "::warning::appimagetool digest is $ACTUAL, expected $EXPECTED (upstream rebuilt the rolling 'continuous' tag); continuing"
          fi

          ./appimagetool.AppImage --no-appstream AppDir \
            "openfield-linux-${BUILD_NAME}.AppImage"

          ls -lh ./*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: openfield-Linux
          path: |
            openfield-linux-${{ env.BUILD_NAME }}.tar.gz
            openfield-linux-${{ env.BUILD_NAME }}.AppImage

  macos:
    if: inputs.build_macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BUILD_NAME=$(echo "$VER" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VER" | cut -d'+' -f2)
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
      - name: Write config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": "$BUILD_NUMBER"
          }
          EOF
      - name: Get dependencies
        run: flutter pub get
      - name: Build
        run: flutter build macos --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
      # Ship just the .app bundle — dSYMs / build logs / pod files from the
      # Products directory are build debris nobody installs. The bundle is
      # named after the product (openfield.app), NOT Runner.app; glob for
      # *.app so a product-name change never breaks packaging again.
      - name: Package app bundle
        run: |
          cd build/macos/Build/Products/Release
          APP_NAME=$(ls -d *.app | head -n 1)
          echo "packaging $APP_NAME"
          zip -qry ../../../../../openfield-macos-${{ env.BUILD_NAME }}.zip "$APP_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: openfield-macOS
          path: openfield-macos-${{ env.BUILD_NAME }}.zip

  android:
    if: inputs.build_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BUILD_NAME=$(echo "$VER" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VER" | cut -d'+' -f2)
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
      - name: Write config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": "$BUILD_NUMBER"
          }
          EOF
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        if: env.ANDROID_KEYSTORE != ''
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
      - name: Create key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.ANDROID_KEYSTORE_PASSWORD != ''
        run: |
          # key.properties must live in android/ (the gradle root project),
          # not android/app/, or the release signing config is never loaded.
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
      # Renamed from flutter's generic app-release.apk: release assets are
      # keyed by filename, and a generic name would collide across versions
      # (the release job skips an asset whose name is already attached).
      - name: Rename APK
        run: |
          for apk in build/app/outputs/flutter-apk/*.apk; do
            mv "$apk" "$(dirname "$apk")/openfield-android-${BUILD_NAME}.apk"
          done
          ls build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: openfield-Android
          path: build/app/outputs/flutter-apk/*.apk

  ios:
    if: inputs.build_ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BUILD_NAME=$(echo "$VER" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VER" | cut -d'+' -f2)
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
      - name: Write config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": "$BUILD_NUMBER"
          }
          EOF
      - name: Get dependencies
        run: flutter pub get
      - name: Decode certificate
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        if: env.IOS_CERTIFICATE_P12 != ''
        run: |
          echo "$IOS_CERTIFICATE_P12" | base64 -d > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import certificate.p12 -P "$IOS_CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
      - name: Decode provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        if: env.IOS_PROVISIONING_PROFILE != ''
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE" | base64 -d > profile.mobileprovision
          UUID=$(security cms -D -i profile.mobileprovision | \
            xmllint --xpath "string(//key[.='UUID']/following-sibling::string[1])" -)
          cp profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision
          echo "IOS_PROVISIONING_PROFILE_NAME=$UUID" >> $GITHUB_ENV
      - name: Set signing flag
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$IOS_TEAM_ID" ]; then
            echo "HAS_SIGNING=1" >> $GITHUB_ENV
          else
            echo "HAS_SIGNING=0" >> $GITHUB_ENV
          fi
      - name: Build IPA (unsigned)
        if: env.HAS_SIGNING == '0'
        run: |
          flutter build ios --release --no-codesign --split-debug-info=build/ios/debug-info --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
          find build/ios/iphoneos/Runner.app -type f -exec sh -c 'file -b "$1" | grep -q "^Mach-O" && strip -S "$1"' _ {} \; 2>/dev/null || true
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          # Named for the version, not "Runner.ipa": release assets are keyed
          # by filename, and a generic name would collide across versions.
          cd build/ios/ipa && zip -qr "openfield-ios-${BUILD_NAME}-unsigned.ipa" Payload/ && cd -
      - name: Build IPA (signed)
        if: env.HAS_SIGNING == '1'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_SIGNING_CERTIFICATE: "Apple Distribution"
        run: |
          flutter build ipa --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
          # flutter names the archive after the Xcode scheme (Runner.ipa);
          # rename for the same version-keying reason as the unsigned path.
          for ipa in build/ios/ipa/*.ipa; do
            mv "$ipa" "build/ios/ipa/openfield-ios-${BUILD_NAME}.ipa"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: openfield-iOS
          path: build/ios/ipa/*.ipa

  web:
    if: inputs.build_web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BUILD_NAME=$(echo "$VER" | cut -d'+' -f1)
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
      - name: Write config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": ""
          }
          EOF
      - name: Get dependencies
        run: flutter pub get
      - name: Build web
        # --no-wasm-dry-run: the wasm compatibility scan walks every
        # transitive import and hard-fails on dart:ffi (flutter_js) and
        # dart:html (flutter_secure_storage_web) even though we only ship the
        # JS build. Skip the scan; no wasm artifact is produced either way.
        run: flutter build web --release --no-wasm-dry-run --dart-define-from-file=config.json
      - name: Create zip archive
        run: |
          cd build/web
          zip -r ../../openfield-web-${{ env.BUILD_NAME }}.zip .
          cd -
      - uses: actions/upload-artifact@v4
        with:
          name: openfield-Web
          path: openfield-web-${{ env.BUILD_NAME }}.zip

  # Collects the archives the build jobs uploaded and publishes them to a
  # GitHub Release. One job owns the release so six builds never race on the
  # same tag.
  release:
    # !cancelled() lets this run while some build jobs were skipped (platforms
    # left unchecked); the per-need result guards are what stop it when a
    # build actually failed. Without !cancelled() a skipped job would make
    # GitHub skip this one too.
    if: ${{ !cancelled() && inputs.publish_release && needs.windows.result != 'failure' && needs.linux.result != 'failure' && needs.macos.result != 'failure' && needs.android.result != 'failure' && needs.ios.result != 'failure' && needs.web.result != 'failure' }}
    needs: [windows, linux, macos, android, ios, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute release version
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BUILD_NAME=$(echo "$VER" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VER" | cut -d'+' -f2)
          # A pubspec without a "+N" suffix makes cut return the whole string;
          # fall back to 0 so the tag stays a valid, stable identifier.
          if [ -z "$BUILD_NUMBER" ] || [ "$BUILD_NUMBER" = "$BUILD_NAME" ]; then BUILD_NUMBER=0; fi
          echo "RELEASE_TAG=${BUILD_NAME}+${BUILD_NUMBER}" >> $GITHUB_ENV
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A release that exists but has no assets (a previous run died
          # halfway) must be reusable, otherwise the build is stranded.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists, attaching assets"
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "Automated build for version $RELEASE_TAG" \
              --target "$GITHUB_SHA"
          fi

          # Skip a file when an asset of the same name is already attached, so
          # re-running a partially-failed build neither duplicates nor clobbers
          # an archive that is already published.
          shopt -s nullglob
          for f in staging/*; do
            base=$(basename "$f")
            if gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' | grep -Fxq "$base"; then
              echo "::notice::skipping $base — already attached to $RELEASE_TAG"
              continue
            fi
            echo "uploading $base"
            gh release upload "$RELEASE_TAG" "$f" --clobber
          done